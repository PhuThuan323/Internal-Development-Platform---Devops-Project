# gitops/apps/frontend.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontendservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PhuThuan323/Internal-Development-Platform---Devops-Project.git
    targetRevision: main
    path: charts
    helm:
      valueFiles:
        - ../apps/values.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true